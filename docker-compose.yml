version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-pro
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Для кастомных настроек (необязательно):
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    networks:
      - postgres-net
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  postgres-net: