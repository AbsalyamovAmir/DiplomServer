spring:
  application:
    name: "FstecParser"
    jpa:
      properties:
        hibernate:
          batch_size: 1000

  datasource:
    url: jdbc:postgresql://localhost:5432/fstecParserDB
    username: admin
    password: admin

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG


fstec:
  url: https://bdu.fstec.ru/files/documents/vulxml.zip
  retry:
    count: 3
    thread-sleep: 1000
  task:
    #    каждую субботу в 12 часов дня
    cron: 0 0 12 * * SUN
  #    поменять на false если надо распарсить файл, а не грузить архив с сайта
  stub: true
  file:
    path: D:\projects\projectfiles\export\export.xml

