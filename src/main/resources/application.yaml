spring:
  application:
    name: "FstecParser"
    jpa:
      properties:
        hibernate:
          batch_size: 1000

  datasource:
    url: jdbc:postgresql://localhost:5432/fstecParserDB
    username: admin
    password: admin

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.transaction: debug


fstec:
  url: https://bdu.fstec.ru/files/documents/vulxml.zip
  retry:
    count: 3
    thread-sleep: 1000
  task:
    #    каждую субботу в 12 часов дня
    cron: 0 0 12 * * SUN
